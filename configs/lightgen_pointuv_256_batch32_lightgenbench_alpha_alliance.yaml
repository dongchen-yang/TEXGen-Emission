# LIGHTGENBENCH ALPHA (2026-09-19): the paper's TEXGen recipe, retrained on the released
# dataset (Hugging Face 3dlg-hcvc/LightgenBench: 36,426 train / 200 val / 200 test).
#
# THIS IS A DATA PORT OF lightgen_pointuv_256_batch32_emissive_74k_v2_alpha_fir_agentic.yaml,
# the fir port of the paper run texgen_alpha_74k_v2_agentic. The code is the paper run's,
# unchanged. It differs from that file ONLY in what it reads and what the run is called:
#   1. tag                                 -> texgen_alpha_lightgenbench_v1
#   2. data_root / parquet / *_indices     -> the staged release (see the data block)
#   3. checkpoint.dirpath                  -> a new directory
#   4. the wandb block
# EVERY training-relevant value is byte-identical: seed 42, per-GPU batch 32 x 4 GPUs =
# global 128, in_channels 13, use_alpha, LR 5e-4 / WD 0.01, T_max 34,380, max_epochs 125,
# precision bf16-mixed, save_top_k -1, every_n_epochs 5, num_workers 4.
#
# WHAT THE NEW DATA CHANGES, none of it in this file's values:
#   * train is 36,426 shapes, not 36,255, so an epoch is 285 steps, not 284, and the run
#     is 125 x 285 = 35,625 steps. SCORE AT epoch 124 / step 35,625.
#   * val and test are the release's 200 / 200, not the paper's 387 / 388, and the bake is
#     the 2026-09-09 one (emission is the source texture alone). Numbers from this run do
#     not sit in one table with the paper's rows.
#   * alpha is a key inside each npz, which the loader reads first; there is no sidecar.
#
# SITE: any Alliance cluster with 4 x H100 80 GB. No path in this file names a cluster:
# the data paths resolve into $SLURM_TMPDIR, and the launcher overrides exp_root_dir and
# checkpoint.dirpath on the command line. Launcher: scripts/internal/fir/train_lightgenbench_alpha_fir.sh.
# TEXGEN_ENABLE_FLASH=0 is set by the launcher, as for every arm of the paper.
#
# ---- inherited from the alpha baseline config, unchanged ----
#
# Input channel order (assembled in lightgen_system.forward + lightgen_pointuvnet.forward):
#   noisy_emission(3) + position(3) + albedo(3) + metal(1) + rough(1) + ALPHA(1) + mask(1)
# Alpha rides inside baked_texture (5 -> 6 ch) so it lands before the occupancy mask and
# gets the same [0,1] -> [-1,1] remap as albedo/metal/rough.
#
# NOTE in_channels: 13 ALSO describes the unrelated gt_mask_cond variant. The two are told
# apart by an explicit flag, never by channel count: alpha is always read, and this run leaves
# backbone.use_gt_emission_mask_cond at its false default.
#
name: lightgen
tag: "texgen_alpha_lightgenbench_v1"
exp_root_dir: "/scratch/dya78/lightgen/texgen_runs"
seed: 42

# Resume on requeue / job restart.
auto_resume: true

# Data: 36,426 train / 200 val / 200 test, the LightgenBench release. The data paths
# resolve into $SLURM_TMPDIR, which is node-local, outside the inode quota, and WIPED AT
# JOB END — so the launcher unpacks the release's atlas and thumbnail tars (~75 GB) from
# /scratch at the start of every segment, and checkpoints go to /scratch instead.
#   - texgen_root/<uuid>/somage.npz      (the release's <uuid>/atlas.npz, renamed as it
#     is unpacked; same keys and encoding as somage.npz, plus alpha)
#   - texgen_root/thumbnails/<uuid>.png  (CLIP conditioning; a MISSING file
#     does not raise — LightGenSystem warns and silently falls back to the albedo UV
#     map, which is how an early run trained 8 epochs on wrong conditioning)
# The split's indices are POSITIONAL into the parquet filtered to success==True. Both
# files are written from the release's splits.json by scripts/lightgenbench/build_index.py
# at the start of every segment, and its --check proves the indices select those uuids.
data_cls: spuv.data.mesh_uv.ObjaverseDataModule
data:
  # ${oc.env:SLURM_TMPDIR} is resolved by OmegaConf at load time (omegaconf 2.3.0 on fir).
  # Outside a SLURM job this raises rather than silently pointing somewhere wrong.
  data_root: "${oc.env:SLURM_TMPDIR}/lightgen/data/texgen_root"
  parquet_file: "${oc.env:SLURM_TMPDIR}/lightgen/data/df_lightgenbench.parquet"
  scene_list: ""
  eval_scene_list: ""
  repeat: 1
  vertex_transformation: false
  cond_views: 1
  sup_views: 4
  camera_strategy: "strategy_1"
  eval_cond_views: 1
  eval_sup_views: 4
  eval_camera_strategy: "strategy_test_1_to_4_90deg"

  # A missing npz does not fail loudly: __getitem__ catches, returns None, and collate_fn
  # drops it — a split would silently shrink. The launcher therefore counts the unpacked
  # files against the split before training. All three keys point at ONE file.
  train_indices: "${oc.env:SLURM_TMPDIR}/lightgen/data/data_splits_lightgenbench.json"
  val_indices: "${oc.env:SLURM_TMPDIR}/lightgen/data/data_splits_lightgenbench.json"
  test_indices: "${oc.env:SLURM_TMPDIR}/lightgen/data/data_splits_lightgenbench.json"

  height: 256
  width: 256
  uv_height: 256
  uv_width: 256
  batch_size: 32         # per-GPU; 1 node x 4 Pro 6000 = 4 ranks -> global 128
  eval_batch_size: 16    # global 64
  # ⚠️ H100 IS 80 GB, NOT 96 GB. The peak below was measured on a 96 GB Blackwell Max-Q;
  # 69.23 GB leaves ~10 GB of headroom on an H100 rather than ~26. The launcher runs a
  # short probe first for exactly this reason. If it OOMs, do NOT quietly drop per-GPU
  # batch — that breaks global batch 128; use the launcher's BS/NUM_GPUS guard instead.
  # per-GPU 32 CONFIRMED BY MEASUREMENT on cs-venus-05 (2026-07-29, 4 training steps
  # on one RTX PRO 6000 Blackwell Max-Q, 97,887 MiB):
  #   fit_start        allocated  6.64 GB
  #   before_backward  allocated 54.06 GB, free 40.91 GB
  #   epoch_end        PEAK      69.23 GB  -> ~26 GB headroom, no OOM
  # So this matches the reference run's per-GPU batch exactly, with no accumulation.
  #
  # Do NOT re-derive this from the H100 table in TEXGen/CLAUDE.md (static ~14 GB +
  # 1.37 GB/sample): that model underestimates on the torch-2.9 stack — it predicted
  # 35.9 GB for micro-batch 16 where an L40S actually peaked at 41.99 GB and OOM'd.
  # A two-point fit of real L40S measurements projected ~65 GB here; the measured
  # 69.23 GB is close, but the number in this config is the measured one.
  #
  # 4 workers x 4 ranks = 16 processes, down from 24. Each dataloader worker holds a
  # copy of the 824,858-row sample index that _load_from_parquet builds, so worker
  # count multiplies host RAM directly — job 237314 died OUT_OF_MEMORY at exactly its
  # 200G ceiling. The GPU is the bottleneck here (5-6 s/step), not the loader, so
  # fewer workers should not cost throughput; raise it again only if the loader
  # visibly lags.
  num_workers: 4

system_cls: spuv.systems.lightgen_system.LightGenSystem
system:
  condition_drop_rate: 0.1
  rescale_betas_zero_snr: true
  use_ema: true
  ema_decay: 0.9999
  val_with_ema: true
  render_background_color: [0.0, 0.0, 0.0]
  train_regression: false
  recon_warm_up_steps: 0
  prediction_type: "v_prediction"
  check_train_every_n_steps: 1000
  test_save_json: false
  test_save_mid_result: false
  cleanup_after_validation_step: true

  test_cfg_scale: 2.0
  test_num_steps: 50
  guidance_rescale: 0.0
  guidance_interval: [0.0, 1.0]

  cond_rgb_perturb: false

  image_tokenizer_cls: spuv.models.tokenizers.clip.ClipTokenizer
  image_tokenizer:
    pretrained_model_name_or_path: "lambdalabs/sd-image-variations-diffusers"

  backbone_cls: spuv.models.sparse_networks.lightgen_pointuvnet.LightGenPointUVNet
  backbone:
    in_channels: 13
    out_channels: 3
    num_layers: [1, 1, 1, 1, 1]
    point_block_num: [1, 1, 2, 4, 6]
    block_out_channels: [32, 256, 1024, 1024, 2048]
    dropout: [0.0, 0.0, 0.0, 0.1, 0.1]
    block_type: ["uv", "point_uv", "uv_dit", "uv_dit", "uv_dit"]
    voxel_size: [0.01, 0.02, 0.05, 0.05, 0.05]
    window_size: [0, 128, 128, 256, 256]
    num_heads: [4, 4, 16, 16, 16]
    skip_input: true
    skip_type: "adaptive"
    use_uv_head: true

  loss:
    diffusion_loss_dict:
      lambda_mse: 1.0
      lambda_l1: 0.5
      lambda_dark_region: 0.0
      emissive_threshold: 0.001
    render_loss_dict:
      lambda_render_lpips: 0.0
      lambda_render_mse: 0.0
      lambda_render_l1: 0.0
    use_min_snr_weight: false
    use_vgg: false

  optimizer:
    name: AdamW
    args:
      lr: 5e-4
      betas: [0.9, 0.999]
      weight_decay: 0.01

  scheduler:
    name: CosineAnnealingLR
    interval: step
    args:
      # FROZEN 2026-07-29. T_max = 34,380 optimizer steps = exactly the compute the
      # superseded baseline actually received (its checkpoint stores global_step
      # 34,380 = 573 steps/epoch x 60 epochs at the same global batch 128). So this
      # run replaces that model at equal compute, and unlike it the cosine reaches
      # eta_min instead of stopping at LR 7.4e-5 three quarters of the way down.
      #
      # Anchored to STEPS, not wall-clock, so it does not depend on a throughput
      # estimate. max_epochs = ceil(34380 / 560) = 62.
      #
      # DO NOT EDIT once training starts: T_max is read from the config on every
      # resume while scheduler.last_epoch comes from the checkpoint, so changing it
      # mid-run warm-restarts the LR — the exact defect the old run carried.
      T_max: 34380
      eta_min: 1e-6

trainer:
  # 125 is the paper run's max_epochs, kept. There it was the smallest value that (a)
  # covers T_max 34,380 and (b) ends on a scheduled save epoch (every_n_epochs 5 ->
  # epochs 4, 9, ..., 124) at 284 steps/epoch; at this train set's 285 = ceil(36426 / 128)
  # steps/epoch both still hold: 125 x 285 = 35,625 steps vs the paper run's 35,500.
  #
  # The last ~1,245 steps run PAST T_max, and torch's stock CosineAnnealingLR turns back
  # UP there rather than holding eta_min: LR is 1.00e-6 at step 34,380 and 2.61e-6 at
  # step 35,625 (closed form; the same form gives the 2.31e-6 the paper run measured at
  # its step 35,500). That is not eta_min, but it is ~200x below base LR 5e-4. Do not
  # restate this as "at eta_min". SCORE AT epoch 124 / step 35,625.
  max_epochs: 125
  check_val_every_n_epoch: 1    # 285 steps/epoch at global batch 128
  num_sanity_val_steps: 2
  precision: bf16-mixed
  gradient_clip_val: 1.0
  num_nodes: 1
  log_every_n_steps: 50

checkpoint:
  # A NEW directory, and that is load-bearing: auto_resume globs this path for a
  # last*.ckpt, so pointing here at another run's dirpath would silently resume that run
  # instead of training this one. The launcher overrides this value per cluster.
  # ON /scratch, NOT $SLURM_TMPDIR: TMPDIR is wiped at job end, so a checkpoint written
  # there would vanish on every requeue and auto_resume would silently cold-start.
  dirpath: "/scratch/dya78/lightgen/texgen_runs/output_lightgenbench_alpha_v1/"
  save_last: true
  # -1 = keep EVERY scheduled save, unconditionally.
  #
  # save_top_k: 5 with monitor: val/psnr silently STOPPED checkpointing entirely.
  # val/psnr peaks early on sparse emission (an all-dark prediction scores well) and
  # then oscillates lower, so once five early checkpoints held the top-5 slots no
  # later epoch could beat them — Lightning skipped the save, and last.ckpt stopped
  # refreshing with it. Observed on job 237655: nothing written between epoch 24 and
  # epoch 32, and on that trajectory the run would have finished 62 epochs with no
  # final checkpoint at all, since epoch 59 (the last scheduled save) is subject to
  # the same suppression.
  #
  # 25 saves (epochs 4..124) x 12.4 GB = ~310 GB on /scratch (fir: 13.8 TiB free on
  # 2026-09-19). Cost in INODES is 25 files — irrelevant against the quota.
  save_top_k: -1
  every_n_epochs: 5
  monitor: "val/psnr"
  mode: "max"
  save_on_train_epoch_end: false

wandb:
  project: "LightGen"
  name: "texgen_alpha_lightgenbench_v1"
  tags: ["baseline", "from_scratch", "lightgenbench", "release_split", "alpha_cond"]
  notes: "The paper's TEXGen recipe (texgen_alpha_74k_v2_agentic) retrained on the released dataset, Hugging Face 3dlg-hcvc/LightgenBench: 36,426 train / 200 val / 200 test, splits.json sha256 6ab3bae5453ba64a1c995a8c178c999cea6bb89f796918521752440b66dfe87e, the 2026-09-09 bake (emission is the source texture alone, alpha inside the npz). Code unchanged. Every training-relevant value is byte-identical to the paper config: seed 42, global batch 128, in_channels 13, use_alpha, LR 5e-4 / WD 0.01, T_max 34,380, max_epochs 125, bf16-mixed, from scratch, TEXGEN_ENABLE_FLASH=0. 125 x 285 = 35,625 steps; score at epoch 124. Trained on an Alliance cluster, 4x H100 80 GB."
