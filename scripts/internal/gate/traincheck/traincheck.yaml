# Training check (REFACTOR_TODO.md step 7, decision D5): the release config, unchanged except for
# what this file lists, on the small check root that make_check_root.py builds. Run it through
# train-check.sh, which sets the two environment variables and runs from the TEXGen root
# (`extends` is relative to it).
#   TRAINCHECK_ROOT  the check root (16 train / 2 val / 2 test release shapes)
#   TRAINCHECK_OUT   this run's output dir
extends: configs/lightgen_pointuv_256_batch32_lightgenbench_alpha_alliance.yaml
tag: traincheck
use_timestamp: false
exp_root_dir: ${oc.env:TRAINCHECK_OUT}
auto_resume: false

data:
  data_root: ${oc.env:TRAINCHECK_ROOT}
  parquet_file: ${oc.env:TRAINCHECK_ROOT}/df_lightgenbench.parquet
  train_indices: ${oc.env:TRAINCHECK_ROOT}/data_splits_traincheck.json
  val_indices: ${oc.env:TRAINCHECK_ROOT}/data_splits_traincheck.json
  test_indices: ${oc.env:TRAINCHECK_ROOT}/data_splits_traincheck.json
  batch_size: 1          # 16 steps per epoch on 16 shapes; batch 2 runs out of memory on a 24 GB 4090
  eval_batch_size: 1
  num_workers: 2

trainer:
  max_epochs: 2          # 32 steps; validation after each epoch, then trainer.test (launch.py)
  log_every_n_steps: 1

checkpoint:
  dirpath: ${oc.env:TRAINCHECK_OUT}/ckpts
  save_last: false
  every_n_epochs: 2      # one save, at the end (12.4 GB; train-check.sh deletes it afterwards)
